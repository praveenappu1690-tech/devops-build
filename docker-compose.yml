
services:
  web:
    image: ${APP_IMAGE:-praveenappu/dev:latest}
    container_name: devops-react-app
    restart: unless-stopped
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

